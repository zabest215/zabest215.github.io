<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakariae Idrissi | 3D Portfolio Campus</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay (Glassmorphism) -->
    <main id="ui-layer" class="glass-panel">
        <div id="ui-content" class="fade-in">
            <!-- Content injected by JS -->
        </div>
    </main>

    <!-- Navigation Hub -->
    <nav class="glass-nav">
        <div class="logo">Zakariae<span>Tech</span></div>
        <div class="nav-buttons" id="nav-container">
            <!-- Buttons injected by JS -->
        </div>
        <div class="controls">
            <button id="theme-toggle" class="icon-btn" title="Tag/Nacht Modus"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Lade Technologiezentrum...</p>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
