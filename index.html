<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakariae Idrissi | 3D Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <main id="ui-layer" class="glass-panel">
        <div class="content-wrapper" id="dynamic-content">
            </div>
    </main>

    <nav class="glass-nav">
        <div class="logo">ZI<span>3D</span></div>
        <div class="nav-buttons" id="nav-container">
            </div>
        <div class="controls">
            <button id="audio-toggle" class="icon-btn" title="Hintergrundmusik"><i class="fas fa-music"></i></button>
        </div>
    </nav>

    <div id="loader">
        <div class="spinner"></div>
        <p>Lade Smart House Umgebung...</p>
    </div>

    <audio id="bg-audio" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/02/22/audio_d1718ab41b.mp3?filename=ambient-piano-amp-strings-10711.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
